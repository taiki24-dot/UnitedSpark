<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<script>try{if(localStorage.getItem("us-theme")==="light")document.documentElement.setAttribute("data-theme","light")}catch(e){}</script>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E⚡%3C/text%3E%3C/svg%3E">
<title>United Spark 練習日程ボード</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800;900&display=swap">
<style>
:root{--bg:#0a0912;--ink:#f7f5ff;--mute:#a9a5c4;--y:#ffe033;--y2:#ffb300;--cy:#3fe0ff;--pk:#ff5fa8;--pu:#8b6bff;--gn:#5dffa0;--or:#ff8a3d;
--font:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Hiragino Kaku Gothic ProN","Noto Sans JP",system-ui,sans-serif;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg);
background-image:radial-gradient(circle 260px at 12% 4%,var(--g1),transparent 70%),radial-gradient(circle 300px at 95% 22%,var(--g2),transparent 70%),radial-gradient(circle 280px at 5% 75%,var(--g3),transparent 70%);background-attachment:fixed}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0 auto;color:var(--ink);font:500 15px/1.6 var(--font);max-width:520px;padding:20px 14px 60px}
.brand{font:900 36px/1.05 var(--font);color:var(--yt);letter-spacing:.01em;text-shadow:0 3px 0 #b37400,0 0 26px rgba(255,224,51,.55);margin:4px 0 0;animation:pop .6s cubic-bezier(.3,1.6,.5,1) 1}
.brand i{font-style:normal;display:inline-block;animation:wig 2.4s ease-in-out infinite}
.sub0{font-size:14px;font-weight:800;color:var(--cyt);margin:2px 0 10px}
.sweep{height:6px;margin-bottom:16px;border-radius:99px;background:linear-gradient(90deg,var(--y),var(--or),var(--pk),var(--pu),var(--cy));opacity:.95;box-shadow:0 0 16px rgba(255,179,0,.4)}
@keyframes pop{0%{transform:scale(.6);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes wig{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(10deg) scale(1.12)}}
@keyframes up{0%{transform:translateY(14px) scale(.92);opacity:0}100%{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.tabs{display:flex;gap:6px;margin-bottom:16px;background:linear-gradient(var(--s1),var(--s1)),var(--bg);padding:6px;border-radius:99px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 6px);z-index:30;box-shadow:0 6px 16px var(--sh)}
.tabs button{flex:1;background:none;border:0;color:var(--mute);font:800 15px var(--font);padding:12px 4px;cursor:pointer;border-radius:99px;transition:all .2s}
.tabs button[aria-selected=true]{background:linear-gradient(180deg,var(--y),var(--y2));color:#241a00;box-shadow:0 4px 0 #b37400,0 6px 18px rgba(255,179,0,.4)}
button:focus-visible,input:focus-visible{outline:3px solid var(--cy);outline-offset:2px}
.card{background:var(--cardbg);border:2px solid var(--s3);border-radius:24px;padding:16px;margin-bottom:14px;box-shadow:0 6px 0 var(--sh);animation:up .45s cubic-bezier(.3,1.4,.5,1) both}
.sub{font-size:13px;font-weight:700;color:var(--mute);margin:0 0 8px}
.who-bar{display:flex;align-items:center;justify-content:space-between;gap:8px}
.who-bar b{font:900 22px var(--font);color:var(--yt);text-shadow:0 2px 0 #8a5a00}
.lnk{background:var(--s2);border:0;color:var(--ink);border-radius:99px;padding:9px 14px;font:700 13px var(--font);cursor:pointer}
.chips{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:8px 0 12px}
.chip{--c:var(--y);background:var(--chipbg);border:2px solid var(--c);color:var(--ink);padding:18px 8px;font:900 17px var(--font);cursor:pointer;border-radius:20px;box-shadow:0 5px 0 var(--c),0 8px 20px var(--inp);transition:transform .12s,box-shadow .12s;animation:up .5s cubic-bezier(.3,1.5,.5,1) both}
.chip:nth-child(1){--c:var(--y);animation-delay:.05s}.chip:nth-child(2){--c:var(--cy);animation-delay:.1s}.chip:nth-child(3){--c:var(--pk);animation-delay:.15s}.chip:nth-child(4){--c:var(--gn);animation-delay:.2s}.chip:nth-child(5){--c:var(--or);animation-delay:.25s}.chip:nth-child(6){--c:var(--pu);animation-delay:.3s}
.chip:active{transform:translateY(4px);box-shadow:0 1px 0 var(--c)}
.add{display:flex;gap:8px}
.add input,.add .lsel{flex:1;min-width:0;background:var(--inp);border:2px solid var(--s3);border-radius:99px;color:var(--ink);font:700 16px var(--font);padding:11px 16px}
.add input:focus{border-color:var(--y)}
.lsel{background:var(--inp);border:2px solid var(--s3);border-radius:99px;color:var(--ink);font:700 16px var(--font);padding:11px 16px;min-width:0}
.add button,.row button{background:linear-gradient(180deg,var(--y),var(--y2));border:0;color:#241a00;border-radius:99px;padding:11px 18px;font:900 14px var(--font);cursor:pointer;box-shadow:0 4px 0 #b37400;transition:transform .1s,box-shadow .1s}
.add button:active,.row button:active{transform:translateY(3px);box-shadow:0 1px 0 #b37400}
.mh{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.mh b{font:900 19px var(--font)}
.mh button{background:var(--s2);border:0;color:var(--yt);width:44px;height:44px;border-radius:50%;font:900 20px var(--font);cursor:pointer}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.dow{text-align:center;font-size:12px;font-weight:800;color:var(--mute);padding:2px 0}
.dow:first-child{color:var(--pkt)}.dow:nth-child(7){color:var(--cyt)}
.d{position:relative;aspect-ratio:1;border:2px solid transparent;background:var(--s1);border-radius:14px;color:var(--ink);font:800 14px var(--font);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;cursor:pointer;padding:0;transition:transform .12s}
.d:active{transform:scale(.88)}
.d:disabled{opacity:.2;cursor:default}
.d.today{border-color:var(--cy)}
.d.sel{border-color:var(--y);background:rgba(255,224,51,.22);transform:scale(1.08);box-shadow:0 0 18px rgba(255,224,51,.6)}
.d.has::after{content:"";width:7px;height:7px;border-radius:50%;background:var(--y);box-shadow:0 0 8px var(--y)}
.d small{font:900 12px var(--font);line-height:1}
.hrs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
.h{background:var(--s1);border:0;border-radius:16px;color:var(--ink);padding:13px 0;font:800 15px var(--font);cursor:pointer;box-shadow:0 4px 0 var(--inp);transition:transform .1s,box-shadow .1s}
.h:active{transform:translateY(3px);box-shadow:0 1px 0 var(--inp)}
.h[aria-pressed=true]{background:linear-gradient(180deg,var(--y),var(--y2));color:#241a00;box-shadow:0 4px 0 #b37400,0 0 16px rgba(255,179,0,.5)}
.row{display:flex;gap:10px;margin-top:12px}
.row button{flex:1}
.row .dng{background:var(--s2);color:var(--mute);box-shadow:none;font-weight:700}
.st{font-size:13px;font-weight:700;color:var(--mute);min-height:20px;margin-top:10px}
.st.ok{color:var(--gnt)}
.top{display:block;width:100%;text-align:left;background:linear-gradient(135deg,rgba(255,224,51,.18),rgba(139,107,255,.14)),var(--card2);border:2px solid rgba(255,224,51,.5);border-radius:20px;color:var(--ink);padding:12px 14px;margin-top:10px;cursor:pointer;font:600 15px/1.5 var(--font);box-shadow:0 5px 0 var(--sh);transition:transform .1s}
.top:active{transform:translateY(3px)}
.top .big{font:900 20px var(--font);color:var(--yt);text-shadow:0 2px 0 #8a5a00}
.top .ms{font-size:12px;color:var(--mute)}
.bar{display:grid;grid-template-columns:44px 1fr;gap:8px;align-items:center;margin-top:7px}
.bar .t{font-size:13px;font-weight:700;color:var(--mute);text-align:right}
.bar .b{height:28px;background:var(--s1);border-radius:99px;position:relative;overflow:hidden}
.bar .f{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,var(--y),var(--or));border-radius:99px;box-shadow:0 0 14px rgba(255,179,0,.6);transition:width .5s cubic-bezier(.3,1.4,.5,1)}
.bar .c{position:absolute;right:12px;top:0;line-height:28px;font:900 13px var(--font);color:#fff;mix-blend-mode:difference}
.who{font-size:12px;font-weight:600;color:var(--mute);margin:3px 0 0 52px}
.empty{color:var(--mute);font-size:14px;padding:6px 0}
.d.ev::before{content:"⚡";position:absolute;top:1px;right:3px;font-size:10px}
.evc{border-color:rgba(255,224,51,.45)}
.ev1{padding:10px 0 0;margin-top:10px;border-top:2px dashed var(--s2)}
.evr{display:flex;gap:12px;align-items:center}
.evd{flex:none;min-width:84px;background:linear-gradient(180deg,var(--y),var(--y2));color:#241a00;border-radius:16px;padding:6px 10px;font:900 14px/1.3 var(--font);text-align:center;box-shadow:0 3px 0 #b37400}
.evd small{font:800 12px var(--font)}
.evt b{font:900 16px var(--font)}
.evt span{font-size:12px;color:var(--mute)}
.fld{margin-top:10px}
.fld label{display:block;font-size:12px;font-weight:800;color:var(--mute);margin-bottom:4px}
.fld.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fld input,.fld select{width:100%;background:var(--inp);border:2px solid var(--s3);border-radius:16px;color:var(--ink);font:700 16px var(--font);padding:11px 14px;min-height:46px}
.fld input:focus,.fld select:focus{border-color:var(--y);outline:none}
.evx{margin-left:auto;background:var(--s2);border:0;color:var(--pkt);border-radius:99px;padding:8px 12px;font:800 12px var(--font);cursor:pointer}
.nm1{display:inline-block;background:var(--s2);border-radius:99px;padding:5px 12px;margin:3px 4px 0 0;font-weight:800;font-size:13px}
.cx .evd{background:var(--s3);color:var(--mute);box-shadow:none}
.cx .evt b{text-decoration:line-through;color:var(--mute)}
.bd{font-style:normal;font-size:11px;font-weight:900;background:var(--pk);color:#1a0010;border-radius:99px;padding:2px 8px;vertical-align:middle;text-decoration:none;display:inline-block}
.bd.b2{background:var(--cy);color:#00202a}
.hs{font-size:12px;color:var(--cyt);font-weight:700;margin-top:8px}
.rsb{display:flex;gap:8px;margin-top:10px}
.rsb button{flex:1;border:0;border-radius:99px;padding:11px;font:900 14px var(--font);cursor:pointer;background:var(--s2);color:var(--ink);box-shadow:0 4px 0 var(--inp);transition:transform .1s,box-shadow .1s}
.rsb button:active{transform:translateY(3px);box-shadow:0 1px 0 var(--inp)}
.rsb .go[aria-pressed=true]{background:linear-gradient(180deg,var(--gn),#26c978);color:#04281a;box-shadow:0 4px 0 #14935a}
.rsb .no[aria-pressed=true]{background:linear-gradient(180deg,var(--pk),#e0357f);color:#2a0012;box-shadow:0 4px 0 #a01856}
.rs{font-size:12px;color:var(--mute);margin-top:8px;line-height:1.7}
.rs b{font-weight:900;margin-right:6px}
.rs .g{color:var(--gnt)}.rs .n{color:var(--pkt)}
.cb,.eb{display:flex;gap:8px;margin-top:10px}
.cb a,.cb button,.eb button{flex:1;text-align:center;text-decoration:none;background:var(--s2);border:0;color:var(--yt);border-radius:99px;padding:10px 6px;font:800 13px var(--font);cursor:pointer}
.eb button{color:var(--ink);font-size:12px}
.eb .dl{color:var(--pkt)}
.cfo{position:fixed;inset:0;background:var(--ov);display:flex;align-items:center;justify-content:center;padding:24px;z-index:50}
.cfb{background:var(--card2);border:2px solid rgba(255,224,51,.5);border-radius:24px;padding:20px;max-width:340px;width:100%;box-shadow:0 8px 0 var(--sh);animation:pop .3s cubic-bezier(.3,1.6,.5,1)}
.cfb p{margin:0 0 6px;font-weight:800}
.mrow{padding:12px 0;border-top:2px dashed var(--s2)}
.mn{display:flex;align-items:center;gap:8px;font:900 16px var(--font)}
.mrow .pw{display:flex;gap:6px;margin-top:8px}
.mrow input{flex:1;min-width:0;background:var(--inp);border:2px solid var(--s3);border-radius:99px;color:var(--ink);font:700 15px var(--font);padding:9px 14px}
.mrow input:focus{border-color:var(--y);outline:none}
.mrow button{background:var(--s2);border:0;color:var(--yt);border-radius:99px;padding:9px 12px;font:800 12px var(--font);cursor:pointer}
.mrow .sm{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.h small{display:block;font:900 11px var(--font);height:12px;line-height:12px}
.h.g{background:linear-gradient(180deg,var(--y),var(--y2));color:#241a00;box-shadow:0 4px 0 #b37400,0 0 16px rgba(255,179,0,.5)}
.h.m{background:linear-gradient(180deg,#8ff1ff,var(--cy));color:#00222b;box-shadow:0 4px 0 #1796b0,0 0 14px rgba(63,224,255,.4)}
.lg{display:flex;gap:14px;font-size:12px;font-weight:700;color:var(--mute);margin:6px 0 2px;align-items:center}
.lg i{display:inline-block;width:12px;height:12px;border-radius:4px;margin-right:5px;vertical-align:-1px}
.ly{background:linear-gradient(180deg,var(--y),var(--y2))}
.lc{background:var(--cy)}
.chart{display:grid;grid-template-columns:repeat(14,1fr);gap:3px;margin-top:8px}
.bc{background:none;border:0;padding:0;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--ink);font:800 11px var(--font)}
.bc .col{width:100%;height:104px;border-radius:8px;background:var(--s1);display:flex;flex-direction:column-reverse;overflow:hidden}
.bc .sy{background:linear-gradient(0deg,var(--y2),var(--y));box-shadow:0 0 10px rgba(255,179,0,.5)}
.bc .sg{background:var(--cy)}
.bc.on .col{outline:2px solid var(--y)}
.bc .dn{font-size:12px}
.bc .dw{font-size:10px;color:var(--mute);font-weight:700}
.bar .fm{position:absolute;top:0;bottom:0;background:var(--cy);opacity:.9}
.wk{display:grid;grid-template-columns:18px repeat(16,1fr);gap:2px;margin-top:8px;align-items:center}
.wk .l{font-size:11px;font-weight:800;color:var(--mute);text-align:center}
.wk .c{aspect-ratio:1;border-radius:4px;background:var(--s1)}
.pg{display:grid;grid-template-columns:84px 1fr 38px;gap:8px;align-items:center;margin-top:7px;font-size:13px;font-weight:700}
.pg>span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pg .b{height:16px;border-radius:99px;background:var(--s1);overflow:hidden}
.pg .f{height:100%;background:linear-gradient(90deg,var(--y),var(--or));border-radius:99px}
.pg .n{text-align:right;color:var(--mute)}
.nx{--tc:var(--y);display:flex;align-items:center;gap:14px;background:linear-gradient(135deg,color-mix(in srgb,var(--tc) 22%,transparent),rgba(139,107,255,.14)),var(--card);border:2px solid var(--tc);border-radius:24px;padding:12px 16px;margin-bottom:14px;box-shadow:0 5px 0 var(--sh),0 0 22px color-mix(in srgb,var(--tc) 35%,transparent)}
.nx:empty{display:none}
.nxn{flex:none;text-align:center;min-width:76px;line-height:1.1}
.nxn small{display:block;font-size:11px;font-weight:800;color:var(--mute)}
.nxn b{font:900 40px/1 var(--font);color:var(--tc);text-shadow:0 3px 0 var(--inp)}
.nxn span{font:800 13px var(--font);margin-left:2px}
.nxt b{font:900 16px var(--font)}
.nxt span{display:block;font-size:12px;color:var(--mute);font-weight:700;margin-top:2px}
.bd.tp{background:var(--tc,var(--y));color:#241a00}
.ev1:not(.cx) .evd{background:var(--tc,var(--y));box-shadow:0 3px 0 var(--sh)}
.tys{display:flex;gap:6px;flex-wrap:wrap}
.tys button{border:2px solid var(--tc);background:transparent;color:var(--ink);border-radius:99px;padding:8px 14px;font:800 13px var(--font);cursor:pointer}
.tys button[aria-pressed=true]{background:var(--tc);color:#241a00}
.tabs button{font-size:14px}
.ub{font-style:normal;background:var(--pk);color:#1a0010;border-radius:99px;font-size:11px;font-weight:900;padding:1px 7px;margin-left:5px}
.chat{display:flex;flex-direction:column;gap:10px;padding:4px 0 8px}
.dsep{text-align:center;margin:6px 0}
.dsep span{background:var(--s2);border-radius:99px;padding:3px 12px;font-size:12px;font-weight:700;color:var(--mute)}
.msg{display:flex;gap:8px;align-items:flex-start;max-width:90%}
.msg.me{margin-left:auto;flex-direction:row-reverse}
.av{flex:none;width:36px;height:36px;border-radius:50%;background:var(--c);color:#14110a;font:900 16px/36px var(--font);text-align:center}
.mb{min-width:0}
.mn2{font-size:11px;font-weight:800;margin:0 0 2px 4px;color:var(--c)}
.row2{display:flex;align-items:flex-end;gap:6px}
.msg.me .row2{flex-direction:row-reverse}
.bub{border:0;text-align:left;font:600 15px/1.5 var(--font);color:var(--ink);background:var(--bub);border-radius:4px 20px 20px 20px;padding:9px 14px;max-width:100%;word-break:break-word;cursor:pointer}
.msg.me .bub{background:linear-gradient(180deg,var(--y),var(--y2));color:#241a00;border-radius:20px 4px 20px 20px;font-weight:700}
.tm{font-size:10px;color:var(--mute);flex:none;font-weight:700}
.mdl{background:var(--s2);border:0;color:var(--pkt);border-radius:99px;padding:5px 12px;font:800 12px var(--font);cursor:pointer;margin-top:4px}
#cbar{position:fixed;left:0;right:0;bottom:0;padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));background:linear-gradient(180deg,var(--cb0),var(--cb1) 35%);z-index:20}
#cbar[hidden]{display:none}
.cin{max-width:520px;margin:0 auto;display:flex;gap:8px}
.cin input{flex:1;min-width:0;background:var(--card2);border:2px solid var(--s3);border-radius:99px;color:var(--ink);font:600 16px var(--font);padding:12px 18px}
.cin input:focus{border-color:var(--y);outline:none}
.cin button{background:linear-gradient(180deg,var(--y),var(--y2));border:0;color:#241a00;border-radius:99px;padding:0 20px;font:900 15px var(--font);cursor:pointer;box-shadow:0 4px 0 #b37400}
.cin button:active{transform:translateY(3px);box-shadow:0 1px 0 #b37400}

:root{--s1:rgba(255,255,255,.07);--s2:rgba(255,255,255,.1);--s3:rgba(255,255,255,.12);--inp:rgba(0,0,0,.4);--sh:rgba(0,0,0,.45);--card:#17152a;--card2:#1d1a33;--bub:#262344;--cardbg:linear-gradient(160deg,rgba(255,255,255,.1),rgba(255,255,255,.03) 45%),#17152a;--chipbg:linear-gradient(180deg,rgba(255,255,255,.14),rgba(255,255,255,.04)),#211e3a;--yt:#ffe033;--cyt:#3fe0ff;--pkt:#ff5fa8;--gnt:#5dffa0;--g1:rgba(255,224,51,.22);--g2:rgba(139,107,255,.26);--g3:rgba(63,224,255,.14);--cb0:rgba(10,9,18,0);--cb1:rgba(10,9,18,.96);--ov:rgba(5,4,12,.74)}

:root[data-theme=light] .mn2{color:color-mix(in srgb,var(--c) 55%,#000)}
.hd{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.thm{flex:none;background:var(--s2);border:0;color:var(--ink);border-radius:99px;padding:9px 14px;font:800 12px var(--font);cursor:pointer;margin-top:6px}
.thm:active{transform:scale(.94)}
.fld textarea{width:100%;background:var(--inp);border:2px solid var(--s3);border-radius:16px;color:var(--ink);font:700 16px var(--font);padding:11px 14px;resize:vertical}
.fld textarea:focus{border-color:var(--y);outline:none}
html{touch-action:manipulation;-webkit-text-size-adjust:100%}
button{touch-action:manipulation}
.tabs button,.d,.h,.chip,.bc,.top,.thm{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.bub{-webkit-user-select:text;user-select:text}
.bt{display:block;width:100%;text-align:left;background:none;border:0;color:var(--yt);font:900 15px var(--font);padding:2px 0;cursor:pointer}
.dw7{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:8px}
.dw7 button{border:2px solid var(--s3);background:var(--s1);color:var(--ink);border-radius:14px;padding:12px 0;font:800 15px var(--font);cursor:pointer}
.dw7 button[aria-pressed=true]{background:linear-gradient(180deg,var(--y),var(--y2));color:#241a00;border-color:transparent;box-shadow:0 3px 0 #b37400}
.bands{display:flex;gap:8px;margin-top:10px}
.bands button{flex:1;background:var(--s2);border:0;color:var(--yt);border-radius:99px;padding:11px 4px;font:800 14px var(--font);cursor:pointer}
.bands button:active{transform:translateY(2px)}
.bk2{display:flex;gap:6px}
.bk2 button{flex:1;border:2px solid var(--s3);background:var(--s1);color:var(--ink);border-radius:99px;padding:8px 4px;font:800 13px var(--font);cursor:pointer}
.bk2 button[aria-pressed=true]{background:var(--y);color:#241a00;border-color:var(--y)}
.mostly{margin-top:12px;display:flex;gap:10px;align-items:center;background:linear-gradient(135deg,rgba(255,224,51,.18),transparent),var(--s1);border:2px solid var(--y);border-radius:18px;padding:12px}
.mostly>div{flex:1;min-width:0;font-size:12px;color:var(--mute);font-weight:700;line-height:1.6}
.mostly b{display:block;color:var(--ink);font:900 15px var(--font);margin-bottom:2px}
.mostly select{background:var(--inp);border:2px solid var(--s3);border-radius:99px;color:var(--ink);font:800 12px var(--font);padding:3px 8px;margin:0 4px}
.mostly>button{flex:none;background:linear-gradient(180deg,var(--y),var(--y2));border:0;color:#241a00;border-radius:99px;padding:12px 14px;font:900 14px var(--font);cursor:pointer;box-shadow:0 4px 0 #b37400}
.mostly>button:active{transform:translateY(3px);box-shadow:0 1px 0 #b37400}
</style>
</head>
<body>
<div class="hd"><div><div class="brand"><i>⚡</i> United Spark</div>
<p class="sub0">みんなの練習日程ボード</p></div><button id="thm" class="thm" aria-label="ホワイトとブラックを切り替える">☀️ ホワイト</button></div>
<div class="sweep"></div>
<div id="nx" class="nx"></div>
<div class="tabs" role="tablist">
  <button role="tab" id="t-in" aria-selected="true">入力</button>
  <button role="tab" id="t-out" aria-selected="false">結果</button>
  <button role="tab" id="t-ch" aria-selected="false">チャット</button>
  <button role="tab" id="t-ld" aria-selected="false" hidden>管理者</button>
</div>
<div id="app"></div>
<div id="cf"></div>
<div id="cbar" hidden><div class="cin"><input type="text" id="cmsg" maxlength="300" placeholder="メッセージを入力" autocomplete="off"><button data-act="csend">送信</button></div></div>
<script type="module" src="./firebase.js"></script>
</body>
</html>
